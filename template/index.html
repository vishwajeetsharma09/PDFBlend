<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link href="../styles.css" rel="stylesheet" />
    <title>DocHub Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Configure Tailwind for dark mode
      tailwind.config = {
        darkMode: "class",
      };
    </script>
  </head>
  <body class="bg-gray-100 dark:bg-gray-900">
    <nav class="bg-white dark:bg-gray-800 shadow-lg">
      <div class="max-w-6xl mx-auto px-4">
        <div class="flex justify-between">
          <div class="flex space-x-7">
            <div>
              <a href="#" class="flex items-center py-4 px-2">
                <span
                  class="font-semibold text-gray-500 dark:text-gray-300 text-lg"
                  >DOCHUB PRO</span
                >
              </a>
            </div>
          </div>
          <div class="hidden md:flex items-center space-x-3">
            <button
              id="theme-toggle"
              class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition duration-300"
            >
              <svg
                id="theme-icon"
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
      <h1
        class="text-3xl font-bold text-gray-800 dark:text-gray-200 mb-6 text-center"
      >
        DocHub Pro
      </h1>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- PDF Merge Box -->
        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
          <div class="mb-4">
            <label
              class="block text-gray-700 text-center dark:text-gray-300 text-sm font-bold mb-2"
              for="pdf"
            >
              Select PDF files to merge
            </label>
            <div class="flex gap-2">
              <input
                type="file"
                name="pdf"
                id="pdf"
                accept=".pdf"
                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
              />
              <button
                type="button"
                id="addPdf"
                class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50 transition duration-300"
              >
                Add PDF
              </button>
            </div>
          </div>

          <div id="pdfList" class="mb-4">
            <h3 class="text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">
              Selected PDFs:
            </h3>
            <div id="pdfItems" class="pdf-list-container">
              <div class="text-black dark:text-gray-300">
                No PDFs selected yet
              </div>
            </div>
          </div>

          <form
            method="post"
            action="/api/merge"
            enctype="multipart/form-data"
            id="uploadForm"
          >
            <input type="hidden" name="pdfs" id="pdfsInput" />
            <button
              type="submit"
              class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50 transition duration-300"
            >
              Merge PDFs
            </button>
          </form>
        </div>

        <!-- Placeholder boxes for future options -->
        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
          <h3 class="text-gray-700 dark:text-gray-300 text-lg font-bold mb-2">
            Future Option 1
          </h3>
          <p class="text-gray-600 dark:text-gray-400">Coming soon...</p>
        </div>

        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
          <h3 class="text-gray-700 dark:text-gray-300 text-lg font-bold mb-2">
            Future Option 2
          </h3>
          <p class="text-gray-600 dark:text-gray-400">Coming soon...</p>
        </div>

        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
          <h3 class="text-gray-700 dark:text-gray-300 text-lg font-bold mb-2">
            Future Option 3
          </h3>
          <p class="text-gray-600 dark:text-gray-400">Coming soon...</p>
        </div>
      </div>
    </div>

    <script>
      // Theme toggle functionality
      const themeToggle = document.getElementById("theme-toggle");
      const themeIcon = document.getElementById("theme-icon");

      function updateThemeIcon(isDark) {
        if (isDark) {
          themeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          `;
        } else {
          themeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          `;
        }
      }

      // Set initial theme
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
        updateThemeIcon(true);
      } else {
        document.documentElement.classList.remove("dark");
        updateThemeIcon(false);
      }

      themeToggle.addEventListener("click", () => {
        if (document.documentElement.classList.contains("dark")) {
          document.documentElement.classList.remove("dark");
          localStorage.theme = "light";
          updateThemeIcon(false);
        } else {
          document.documentElement.classList.add("dark");
          localStorage.theme = "dark";
          updateThemeIcon(true);
        }
      });

      // PDF selection functionality
      const pdfInput = document.getElementById("pdf");
      const addPdfButton = document.getElementById("addPdf");
      const pdfItems = document.getElementById("pdfItems");
      const pdfsInput = document.getElementById("pdfsInput");
      const uploadForm = document.getElementById("uploadForm");

      let selectedPdfs = [];

      // Add PDF button click handler
      addPdfButton.addEventListener("click", () => {
        const file = pdfInput.files[0];
        if (file) {
          // Check if file is a PDF
          if (file.type !== "application/pdf") {
            alert("Please select a PDF file");
            return;
          }

          // Add file to selected PDFs
          selectedPdfs.push(file);
          updatePdfList();

          // Clear the file input
          pdfInput.value = "";
        } else {
          alert("Please select a PDF file first");
        }
      });

      function createPdfItem(file) {
        const item = document.createElement("div");
        item.className = "pdf-item";

        const fileName = document.createElement("div");
        fileName.className = "file-name";
        fileName.textContent = file.name;

        const controls = document.createElement("div");
        controls.className = "controls";

        const moveUp = document.createElement("button");
        moveUp.className = "move-up";
        moveUp.innerHTML = "↑";
        moveUp.title = "Move up";
        moveUp.onclick = () => movePdf(file, -1);

        const moveDown = document.createElement("button");
        moveDown.className = "move-down";
        moveDown.innerHTML = "↓";
        moveDown.title = "Move down";
        moveDown.onclick = () => movePdf(file, 1);

        const remove = document.createElement("button");
        remove.className = "remove";
        remove.innerHTML = "×";
        remove.title = "Remove";
        remove.onclick = () => removePdf(file);

        controls.appendChild(moveUp);
        controls.appendChild(moveDown);
        controls.appendChild(remove);

        item.appendChild(fileName);
        item.appendChild(controls);

        return item;
      }

      function movePdf(file, direction) {
        const index = selectedPdfs.indexOf(file);
        if (index === -1) return;

        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= selectedPdfs.length) return;

        const temp = selectedPdfs[index];
        selectedPdfs[index] = selectedPdfs[newIndex];
        selectedPdfs[newIndex] = temp;

        updatePdfList();
      }

      function removePdf(file) {
        selectedPdfs = selectedPdfs.filter((f) => f !== file);
        updatePdfList();
      }

      function updatePdfList() {
        const pdfItems = document.getElementById("pdfItems");
        pdfItems.innerHTML = "";

        if (selectedPdfs.length === 0) {
          const emptyState = document.createElement("div");
          emptyState.className = "empty-state";
          emptyState.textContent = "No PDFs selected yet";
          pdfItems.appendChild(emptyState);
          return;
        }

        selectedPdfs.forEach((file) => {
          pdfItems.appendChild(createPdfItem(file));
        });

        // Update the hidden input with the current files
        const dataTransfer = new DataTransfer();
        selectedPdfs.forEach((file) => {
          dataTransfer.items.add(file);
        });
        pdfInput.files = dataTransfer.files;
      }

      // Add form submit event listener
      uploadForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        if (selectedPdfs.length < 2) {
          alert("Please select at least 2 PDFs to merge");
          return;
        }

        try {
          const formData = new FormData();
          selectedPdfs.forEach((file) => {
            formData.append("pdfs", file);
          });

          const response = await fetch("/api/merge", {
            method: "POST",
            body: formData,
          });

          // Check if the response is a PDF
          const contentType = response.headers.get("content-type");
          if (contentType && contentType.includes("application/pdf")) {
            // Get the PDF blob from the response
            const pdfBlob = await response.blob();

            // Create a download link for the merged PDF
            const downloadLink = document.createElement("a");
            downloadLink.href = URL.createObjectURL(pdfBlob);
            downloadLink.download = `merged_${Date.now()}.pdf`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);

            // Clear the selected PDFs
            selectedPdfs = [];
            updatePdfList();
          } else {
            // Handle error response
            const errorData = await response
              .json()
              .catch(() => ({ error: "Failed to merge PDFs" }));
            throw new Error(errorData.error || "Error merging PDFs");
          }
        } catch (error) {
          console.error("Error:", error);
          alert(error.message || "An error occurred while merging PDFs");
        }
      });
    </script>
  </body>
</html>
